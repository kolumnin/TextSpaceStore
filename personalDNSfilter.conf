# personalDNSfilter - Optimized Configuration File
# General-purpose DNS filtering configuration for mobile devices
# Updated: 2026-09-07

# =====================================================
# FILTER LISTS - Comprehensive blocking
# =====================================================

# Primary ad and tracker blocking lists
filter_list=https://adaway.org/hosts.txt
filter_list=https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts
filter_list=https://www.malwaredomainlist.com/hostslist/hosts.txt
filter_list=https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt
filter_list=https://s3.amazonaws.com/lists.disconnect.me/simple_tracking.txt

# Additional security and privacy lists
filter_list=https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
filter_list=https://phishing.army/download/phishing_army_blocklist.txt

# =====================================================
# DNS SETTINGS
# =====================================================

# Primary DNS servers (privacy-focused)
# Using Quad9 for security and privacy
upstream_dns=9.9.9.9
upstream_dns=149.112.112.112
upstream_dns=2620:fe::fe
upstream_dns=2620:fe::9

# Fallback DNS servers
fallback_dns=1.1.1.1
fallback_dns=8.8.8.8
fallback_dns=2606:4700:4700::1111

# DNS query timeout (milliseconds)
query_timeout=5000

# Number of retries for failed queries
query_retries=2

# =====================================================
# CACHING
# =====================================================

# Enable DNS caching for performance
enable_cache=true
cache_size=10000
cache_ttl=3600

# =====================================================
# FILTERING RULES
# =====================================================

# Block ads and trackers
block_ads=true
block_trackers=true

# Whitelist local services and important domains
whitelist=localhost
whitelist=127.0.0.1
whitelist=*.local
whitelist=*.localdomain

# Common services to whitelist (adjust as needed)
whitelist=play.google.com
whitelist=gstatic.com
whitelist=googleapis.com

# =====================================================
# LOGGING
# =====================================================

# Enable logging for troubleshooting
enable_logging=true
log_level=info
log_blocked_requests=true

# Log file location (if supported)
log_file=/var/log/personalDNSfilter.log

# =====================================================
# PERFORMANCE
# =====================================================

# Number of worker threads
worker_threads=4

# Enable IPv6 support
enable_ipv6=true

# Connection pooling
connection_pool_size=32

# =====================================================
# SECURITY
# =====================================================

# DNSSEC validation
enable_dnssec=true

# Response validation
validate_responses=true

# Rate limiting to prevent abuse
enable_rate_limiting=true
rate_limit_queries_per_minute=1000

# =====================================================
# WHITELIST MANAGEMENT
# =====================================================

# Add specific domains that should NOT be blocked
# Uncomment and modify as needed for your use case

# Google services
# whitelist=google.com
# whitelist=*.google.com

# Microsoft services
# whitelist=microsoft.com
# whitelist=*.microsoft.com

# Apple services
# whitelist=apple.com
# whitelist=*.apple.com

# Social media (if desired)
# whitelist=facebook.com
# whitelist=twitter.com
# whitelist=instagram.com

# =====================================================
# ADVANCED OPTIONS
# =====================================================

# Update filter lists automatically
auto_update=true
update_interval=86400

# Compress filter list data
enable_compression=true

# Statistics collection
enable_stats=true

# =====================================================
# NOTES
# =====================================================
# 
# This configuration provides:
# - Comprehensive ad and tracker blocking
# - Privacy-focused DNS servers (Quad9)
# - Malware and phishing protection
# - DNS caching for improved performance
# - DNSSEC validation for security
# - Auto-update capability for filter lists
#
# Adjust whitelist entries based on your specific needs.
# If certain sites/services don't work, add them to the whitelist.
#
