#############################################
# personalDNSfilter mobile import profile    #
# Clean profile; no legacy backup metadata   #
#############################################

detectDNS = true
fallbackDNS = #quad9; [9.9.9.9]::53::UDP; [149.112.112.112]::53::UDP; #adguard; [94.140.14.140]::53::UDP; [94.140.14.141]::53::UDP; #cloudflare; [1.1.1.1]::53::UDP; [1.0.0.1]::53::UDP
passcode = kolumnin
ipVersionSupport = 4,6
ipV4BlockedHost = 0.0.0.0
ipV6BlockedHost = ::
maxResolverCount = 80
enableLocalResolver = true
localResolverTTL = 60
resolveOverHttpProxy = false
httpProxyHost =
httpProxyIP =
httpProxyPort = 8080
httpProxyBasicAuthStr =
routeUnderlyingDNS = false
AUTOSTART = true
androidAppWhiteList = <none>
dnsProxyOnAndroid = true
dnsProxyPortAndroid = 5300
dnsProxyPortNonAndroid = 53
dnsProxyOnlyLocalRequests = true
rootModeOnAndroid = false
vpnInAdditionToProxyMode = false
androidKeepAwake = true
manageDNSCryptProxy = false
dnsCryptProxyStartOptions = -config /system/etc/dnscrypt-proxy/dnscrypt-proxy.toml
enableTrafficLog = true
trafficLogName = trafficlog
trafficLogSize = 1048576
trafficLogSlotCount = 2
client_remote_ctrl_host = 127.0.0.1
client_remote_ctrl_keyphrase = kolumnin-mobile-device-key
client_remote_ctrl_port = 3333
server_remote_ctrl_keyphrase = kolumnin-mobile-device-key
server_remote_ctrl_port = -1
debug = false
dnsRequestTimeout = 15000
filterHostsCacheSize = 1000
allowedHostsCacheSize = 1000
checkResolvedIP = false
checkCNAME = true
filterHostsFile = FILTERHOSTS.TXT
filterActive = true
filterAutoUpdateURL = https://adaway.org/hosts.txt; https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts; https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts
filterAutoUpdateURL_IDs = adaway; stevenblack; pgl
filterAutoUpdateURL_categories = adaway; stevenblack; pgl
filterAutoUpdateURL_switchs = true; true; true
previousAutoUpdateURL =
reloadIntervalDays = 7
filterLogFormat = <font color='#E53935'>($CONTENT)</font>
acceptLogFormat = <font color='#43A047'>($CONTENT)</font>
fwdLogFormat = <font color='#FFB300'>($CONTENT)</font>
normalLogFormat = ($CONTENT)
logTextSize = 14
repeatingLogSuppressTime = 2000
addLiveLogTimestamp = true
liveLogTimeStampFormat = '<font color=''#8c8c8c''><strong>'HH:mm:ss'</strong></font>'
showInitialInfoPopUp = true
initialInfoPopUpTitle = Mobile DNS filter ready
initialInfoPopUpText = Fresh profile for this device.<br><br>Disable Android Private DNS before starting.
dumpDNSPerfInfo = false
useActionMenuFallback = false
forceAndroidDisplayMode = portrait
